schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: Stranger UIKs 2026, a static GitHub Pages site for comparing nearby election precincts.
  Frontend: plain HTML, CSS, and JavaScript; no build step. Serve locally with python3 -m http.server 8000.
  Data: regional JSON files in data/, region index in index.json, district groups in area-groups.json and moscow-areas.json.
  Preserve shareable URLs, History API navigation, and direct regional and precinct links.
  Read README.md and CONTEXT.md before proposing changes. Treat historical precinct coordinates as approximate.
githubCopilot:
  cloudAgent: false

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
