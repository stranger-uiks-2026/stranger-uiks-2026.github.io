name: Organize regional data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move regional files and update the site
        run: |
          mkdir -p data
          git mv [0-9][0-9].json data/
          sed -i "s|fetch('/'+item.file)|fetch('/data/'+item.file)|" app.js
          grep -Fq "fetch('/data/'+item.file)" app.js
          sed -i 's/app.js?v=21/app.js?v=22/g' index.html 404.html
          printf '
Regional JSON files are stored in data/.
' >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move regional JSON files into data directory'
          git push
